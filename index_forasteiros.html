<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi - Forasteiros</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0D0F12;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #161A20;
      border: 1px solid #2A303C;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px auto;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }

    h1 {
      font-size: 22px;
      letter-spacing: 2px;
      color: #FFFFFF;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: #8C96A6;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .info-box {
      background: #0D0F12;
      border: 1px solid #262C36;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #C9A050;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .value {
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      word-break: break-all;
    }

    .btn-copy {
      width: 100%;
      background: #C9A050;
      color: #0D0F12;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-copy:active {
      transform: scale(0.98);
      background: #E6C280;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #525C6B;
    }
  </style>
</head>

    <h1>FORASTEIROS</h1>
    <p class="subtitle">Conecte-se à nossa rede Wi-Fi</p>

    <div class="info-box">
      <div class="label">Rede Wi-Fi</div>
      <div class="value">Forasteiros</div>
    </div>

    <div class="info-box">
      <div class="label">Senha</div>
      <div class="value" id="wifi-password">ClienteForasta</div>
    </div>

    <button class="btn-copy" onclick="copyPassword()">
      <span id="btn-text">Copiar Senha</span>
    </button>

    <div class="footer">Aproveite a sua experiência</div>
  </div>

  <script>
    function copyPassword() {
      const password = document.getElementById('wifi-password').innerText;
      const btnText = document.getElementById('btn-text');

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(password).then(() => {
          btnText.innerText = '✓ Senha Copiada!';
          setTimeout(() => {
            btnText.innerText = 'Copiar Senha';
          }, 2500);
        }).catch(() => {
          fallbackCopy(password, btnText);
        });
      } else {
        fallbackCopy(password, btnText);
      }
    }

    function fallbackCopy(password, btnText) {
      const textarea = document.createElement('textarea');
      textarea.value = password;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        btnText.innerText = '✓ Senha Copiada!';
        setTimeout(() => {
          btnText.innerText = 'Copiar Senha';
        }, 2500);
      } catch (e) {
        alert('Não foi possível copiar automaticamente. Senha: ' + password);
      }
      document.body.removeChild(textarea);
    }
  </script>
